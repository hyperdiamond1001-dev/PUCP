<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUCP Challenge Progression Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans p-6">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-slate-800 pb-6">
            <div>
                <h1 class="text-3xl font-black tracking-wider text-indigo-400">PUCP PROGRESSION TRACKER</h1>
                <p class="text-slate-400 text-sm mt-1">Live progression tracker linked to your Google Sheet (All 50 Tiers).</p>
            </div>
            <div class="mt-4 md:mt-0 bg-slate-900 border border-slate-800 px-4 py-3 rounded-xl text-center">
                <span class="text-xs text-slate-400 uppercase tracking-wider block">Total Progress</span>
                <span id="total-progress-text" class="text-xl font-bold text-emerald-400">Loading...</span>
            </div>
        </header>

        <!-- Main Grid Container -->
        <main id="tracker-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="text-center text-slate-400 py-12 col-span-full">Fetching all 50 tiers from Google Sheets...</div>
        </main>
    </div>

    <script>
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTbwvC0rLYgtcy_szi7Wh9xw_fVwJxI-ntdSyb12PNPTdoKJxoHQ-CpbeUAP_z8U_Kut-1A1CQGTOC6/pub?output=csv';

        let pucpData = {};
        let currentTierKey = null;

        async function fetchSheetData() {
            const container = document.getElementById('tracker-container');
            try {
                const response = await fetch(SHEET_CSV_URL);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const csvText = await response.text();
                const rows = csvText.split('\n').map(row => row.split(',').map(val => val.trim().replace(/^"|"$/g, '')));
                
                pucpData = {};
                currentTierKey = null;

                rows.forEach((row, index) => {
                    const col0 = row[0] || ""; // Tier Name or Level Name
                    const col1 = row[1] || ""; // Requirement (e.g. Beat All, Beat - 10) or Mode
                    const col2 = row[2] || ""; // Tier Number or Level ID

                    if (!col0 && !col1 && !col2) return;
                    if (col0.includes("Paradox's Ultimate Challenge") || col0.includes("Total Levels")) return;

                    const potentialTierNum = parseInt(col2);
                    if (!isNaN(potentialTierNum) && potentialTierNum >= 1 && potentialTierNum <= 50 && col1.toLowerCase().includes("beat")) {
                        currentTierKey = `Tier ${potentialTierNum} - ${col0}`;
                        pucpData[currentTierKey] = {
                            tierNumber: potentialTierNum,
                            tierName: col0,
                            requirement: col1,
                            challenges: []
                        };
                        return;
                    }

                    if (col0.toLowerCase().startsWith("total")) {
                        return;
                    }

                    if (currentTierKey && col0 && col2) {
                        pucpData[currentTierKey].challenges.push({
                            id: `ch_${index}`,
                            name: col0,
                            mode: col1,
                            levelId: col2,
                            completed: false
                        });
                    }
                });

                loadProgress();
                renderTracker();
            } catch (error) {
                console.error('Error fetching sheet:', error);
                container.innerHTML = `
                    <div class="bg-red-950/40 border border-red-800 p-6 rounded-xl text-red-300 col-span-full">
                        <h3 class="font-bold text-lg mb-2">Could Not Read Google Sheet Data</h3>
                        <p class="text-sm text-red-400">Error: ${error.message}</p>
                    </div>
                `;
            }
        }

        function loadProgress() {
            const saved = localStorage.getItem('pucp_progress');
            if (saved) {
                const completedIds = JSON.parse(saved);
                Object.keys(pucpData).forEach(tierKey => {
                    pucpData[tierKey].challenges.forEach(ch => {
                        if (completedIds.includes(ch.id)) ch.completed = true;
                    });
                });
            }
        }

        function saveProgress() {
            const completedIds = [];
            Object.keys(pucpData).forEach(tierKey => {
                pucpData[tierKey].challenges.forEach(ch => {
                    if (ch.completed) completedIds.push(ch.id);
                });
            });
            localStorage.setItem('pucp_progress', JSON.stringify(completedIds));
        }

        function renderTracker() {
            const container = document.getElementById('tracker-container');
            container.innerHTML = '';

            let totalChallenges = 0;
            let totalCompleted = 0;

            const tierKeys = Object.keys(pucpData);
            if (tierKeys.length === 0) {
                container.innerHTML = `<div class="text-slate-400 text-center col-span-full">No challenges found.</div>`;
                return;
            }

            tierKeys.forEach(tierKey => {
                const tierObj = pucpData[tierKey];
                const challenges = tierObj.challenges;
                if (challenges.length === 0) return;

                let tierCompleted = 0;
                let tierTotal = challenges.length;

                let challengesHtml = challenges.map(ch => {
                    totalChallenges++;
                    if (ch.completed) {
                        tierCompleted++;
                        totalCompleted++;
                    }

                    return `
                        <div class="flex items-center justify-between bg-slate-950/60 hover:bg-slate-900 p-3 rounded-lg border border-slate-800/80 transition">
                            <div>
                                <h3 class="font-semibold text-sm ${ch.completed ? 'line-through text-slate-500' : 'text-slate-200'}">${ch.name}</h3>
                                <span class="text-[11px] text-slate-500">${ch.mode} • ID: ${ch.levelId}</span>
                            </div>
                            <input type="checkbox" id="${ch.id}" ${ch.completed ? 'checked' : ''} 
                                onchange="toggleChallenge('${tierKey.replace(/'/g, "\\'")}', '${ch.id}')"
                                class="w-5 h-5 accent-indigo-500 rounded cursor-pointer ml-3">
                        </div>
                    `;
                }).join('');

                let tierPercentage = tierTotal > 0 ? Math.round((tierCompleted / tierTotal) * 100) : 0;

                container.innerHTML += `
                    <section class="bg-slate-900/60 border border-slate-800 rounded-xl p-5 flex flex-col justify-between shadow-lg">
                        <div>
                            <div class="flex justify-between items-start mb-4 border-b border-slate-800 pb-3">
                                <div>
                                    <span class="text-[10px] font-bold text-indigo-400 uppercase tracking-wider block">Tier ${tierObj.tierNumber} • ${tierObj.requirement}</span>
                                    <h2 class="text-md font-bold text-slate-100">${tierObj.tierName}</h2>
                                </div>
                                <span class="text-xs font-semibold text-slate-400 bg-slate-950 px-2.5 py-1 rounded-md border border-slate-800">${tierCompleted} / ${tierTotal}</span>
                            </div>
                            <div class="space-y-2">
                                ${challengesHtml}
                            </div>
                        </div>
                        <div class="mt-4 pt-3 border-t border-slate-800/60 text-right">
                            <span class="text-xs font-medium text-emerald-400">${tierPercentage}% Completed</span>
                        </div>
                    </section>
                `;
            });

            let totalPercentage = totalChallenges > 0 ? Math.round((totalCompleted / totalChallenges) * 100) : 0;
            document.getElementById('total-progress-text').innerText = `${totalCompleted} / ${totalChallenges} (${totalPercentage}%)`;
        }

        window.toggleChallenge = function(tierKey, chId) {
            const tierObj = pucpData[tierKey];
            if (tierObj) {
                const challenge = tierObj.challenges.find(ch => ch.id === chId);
                if (challenge) {
                    challenge.completed = !challenge.completed;
                    saveProgress();
                    renderTracker();
                }
            }
        }

        fetchSheetData();
    </script>
</body>
</html>
