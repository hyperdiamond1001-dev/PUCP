<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUCP Challenge Progression Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans p-6">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-slate-800 pb-6 gap-4">
            <div>
                <h1 class="text-3xl font-black tracking-wider text-indigo-400">PUCP PROGRESSION TRACKER</h1>
                <p class="text-slate-400 text-sm mt-1">Instant progression tracker with Discord review submissions.</p>
            </div>
            
            <div class="flex items-center gap-3 flex-wrap justify-end">
                <!-- Search Bar -->
                <div class="relative">
                    <input type="text" id="search-input" placeholder="Search tiers, levels, IDs..." 
                        oninput="handleSearch()"
                        class="bg-slate-900 border border-slate-700 rounded-md px-4 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 w-56 shadow-inner">
                </div>

                <!-- Refresh Sheet Button -->
                <button onclick="refreshSheetCache()" title="Force fetch latest data from Google Sheets" 
                    class="bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-300 px-3 py-2 rounded-md text-xs font-semibold transition flex items-center gap-1.5">
                    🔄 Refresh Sheet
                </button>

                <div class="bg-slate-900 border border-slate-800 px-4 py-2 rounded-md text-center">
                    <span class="text-[10px] text-slate-400 uppercase tracking-wider block">Total Progress</span>
                    <span id="total-progress-text" class="text-base font-bold text-emerald-400">Loading...</span>
                </div>
            </div>
        </header>

        <!-- Main Grid Container -->
        <main id="tracker-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="text-center text-slate-400 py-12 col-span-full">Loading tracker...</div>
        </main>
    </div>

    <!-- Proof Modal / Prompt Handler -->
    <div id="proof-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-md p-6 max-w-md w-full shadow-2xl">
            <h3 class="text-lg font-bold text-indigo-300 mb-2">Proof Required</h3>
            <p id="proof-modal-text" class="text-sm text-slate-300 mb-4">Tier 21 and above require submission proof (video link, clip, etc.). Please enter your proof link below:</p>
            <input type="text" id="proof-input" placeholder="https://youtube.com/... or clip link" class="w-full bg-slate-950 border border-slate-700 rounded-md px-3 py-2 text-sm text-white mb-4 focus:outline-none focus:border-indigo-500">
            <div class="flex justify-end gap-3">
                <button onclick="closeProofModal(false)" class="px-4 py-2 text-sm bg-slate-800 hover:bg-slate-700 rounded-md text-slate-300 font-medium transition">Cancel</button>
                <button onclick="closeProofModal(true)" class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-500 rounded-md text-white font-medium transition">Submit for Review</button>
            </div>
        </div>
    </div>

    <script>
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTbwvC0rLYgtcy_szi7Wh9xw_fVwJxI-ntdSyb12PNPTdoKJxoHQ-CpbeUAP_z8U_Kut-1A1CQGTOC6/pub?output=csv';
        const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1570158533721460857/-UFXDM4sWtFMTNrnwWbq0UaW84Cldmvl_THzjNud2pq0zatO5NDshE3O3-8zL0eHsb4O';

        let pucpData = {};
        let searchQuery = "";
        
        let pendingTierKey = null;
        let pendingChId = null;

        const customTierColors = [
            { dark: "#fd8989", light: "#ffb3b3" }, { dark: "#fbf09d", light: "#fff8c2" },
            { dark: "#b1d3d4", light: "#d0f3f4" }, { dark: "#c17a7a", light: "#efa2a2" },
            { dark: "#a37dd9", light: "#caa7fb" }, { dark: "#dbb7b7", light: "#efdbdb" },
            { dark: "#f2b3c1", light: "#f2cad3" }, { dark: "#eccda9", light: "#f1dbc1" },
            { dark: "#5d4cb0", light: "#897ad2" }, { dark: "#a8c6c8", light: "#c6e8ea" },
            { dark: "#89b780", light: "#b4deab" }, { dark: "#6d8586", light: "#97b1b2" },
            { dark: "#c3d19b", light: "#e8f4c8" }, { dark: "#74a89f", light: "#9bcfc6" },
            { dark: "#9e4d40", light: "#c46f61" }, { dark: "#e3576f", light: "#ef7c90" },
            { dark: "#caa567", light: "#e5c58f" }, { dark: "#ff76c6", light: "#ffa8db" },
            { dark: "#4e5058", light: "#808495" }, { dark: "#3b6089", light: "#7194bb" },
            { dark: "#a9c369", light: "#d1e996" }, { dark: "#9c4b69", light: "#cd7395" },
            { dark: "#ff9df3", light: "#ffbdf7" }, { dark: "#8b5a70", light: "#c087a1" },
            { dark: "#ff7564", light: "#ff9689" }, { dark: "#b91212", light: "#e03a3a" },
            { dark: "#955f8a", light: "#b982ae" }, { dark: "#758f9e", light: "#aec3cf" },
            { dark: "#143f3e", light: "#2c6362" }, { dark: "#b1eedc", light: "#e5fff7" },
            { dark: "#5f5064", light: "#91799a" }, { dark: "#4b6154", light: "#6e8d7b" },
            { dark: "#734949", light: "#ae7777" }, { dark: "#71163f", light: "#8c345c" },
            { dark: "#babe90", light: "#f3f6d7" }, { dark: "#40324a", light: "#4e395d" },
            { dark: "#caddfd", light: "#ddeaff" }, { dark: "#686897", light: "#9393be" },
            { dark: "#563242", light: "#8d556e" }, { dark: "#530000", light: "#883535" },
            { dark: "#431f45", light: "#674069" }, { dark: "#faf0ac", light: "#fffbde" },
            { dark: "#0d0d60", light: "#282891" }, { dark: "#2e2b51", light: "#4b4583" },
            { dark: "#322334", light: "#4a2b50" }, { dark: "#707260", light: "#9c9e89" },
            { dark: "#40472c", light: "#57613d" }, { dark: "#641d00", light: "#833211" },
            { dark: "#470d36", light: "#6e315c" }, { dark: "#000000", light: "#303030" }
        ];

        function getTextColor(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            const yiq = (r * 299 + g * 587 + b * 114) / 1000;
            return yiq >= 128 ? '#1a1a1a' : '#ffffff';
        }

        function getExactTierColors(tierNum) {
            const index = Math.max(0, Math.min(tierNum - 1, customTierColors.length - 1));
            const pair = customTierColors[index];
            return {
                card: pair.light,
                header: pair.dark,
                text: getTextColor(pair.dark)
            };
        }

        function parseCSVToData(csvText) {
            const rows = csvText.split('\n').map(row => row.split(',').map(val => val.trim().replace(/^"|"$/g, '')));
            let parsedData = {};
            let currentKey = null;

            rows.forEach((row, index) => {
                const col0 = row[0] || ""; 
                const col1 = row[1] || ""; 
                const col2 = row[2] || ""; 

                if (!col0 && !col1 && !col2) return;
                if (col0.includes("Paradox's Ultimate Challenge") || col0.includes("Total Levels")) return;

                const potentialTierNum = parseInt(col2);
                if (!isNaN(potentialTierNum) && potentialTierNum >= 1 && potentialTierNum <= 50 && col1.toLowerCase().includes("beat")) {
                    currentKey = `Tier ${potentialTierNum} - ${col0}`;
                    parsedData[currentKey] = {
                        tierNumber: potentialTierNum,
                        tierName: col0,
                        requirement: col1,
                        challenges: []
                    };
                    return;
                }

                if (col0.toLowerCase().startsWith("total")) return;

                if (currentKey && col0 && col2) {
                    parsedData[currentKey].challenges.push({
                        id: `ch_${index}`,
                        name: col0,
                        mode: col1,
                        levelId: col2,
                        status: 'none', // 'none', 'pending', 'approved', 'rejected'
                        proof: ""
                    });
                }
            });
            return parsedData;
        }

        async function initTracker(forceRefresh = false) {
            const container = document.getElementById('tracker-container');
            const cachedCSV = localStorage.getItem('pucp_csv_cache');

            if (cachedCSV && !forceRefresh) {
                pucpData = parseCSVToData(cachedCSV);
                loadProgress();
                renderTracker();
                backgroundFetchSheet();
                return;
            }

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 4000);

                const response = await fetch(SHEET_CSV_URL, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const csvText = await response.text();
                
                localStorage.setItem('pucp_csv_cache', csvText);
                pucpData = parseCSVToData(csvText);
                loadProgress();
                renderTracker();
            } catch (error) {
                console.warn('Network fetch timed out or failed, falling back to cache:', error);
                if (cachedCSV) {
                    pucpData = parseCSVToData(cachedCSV);
                    loadProgress();
                    renderTracker();
                } else {
                    container.innerHTML = `
                        <div class="bg-red-950/40 border border-red-800 p-6 rounded-md text-red-300 col-span-full">
                            <h3 class="font-bold text-lg mb-2">Could Not Load Sheet Data</h3>
                            <p class="text-sm text-red-400">Please check your internet connection or try clicking 'Refresh Sheet'.</p>
                        </div>
                    `;
                }
            }
        }

        async function backgroundFetchSheet() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                if (response.ok) {
                    const csvText = await response.text();
                    localStorage.setItem('pucp_csv_cache', csvText);
                }
            } catch (e) {}
        }

        function refreshSheetCache() {
            document.getElementById('tracker-container').innerHTML = `<div class="text-center text-slate-400 py-12 col-span-full">Refreshing from Google Sheets...</div>`;
            initTracker(true);
        }

        function loadProgress() {
            const saved = localStorage.getItem('pucp_progress_v3');
            if (saved) {
                const savedData = JSON.parse(saved);
                Object.keys(pucpData).forEach(tierKey => {
                    pucpData[tierKey].challenges.forEach(ch => {
                        if (savedData[ch.id]) {
                            ch.status = savedData[ch.id].status || 'none';
                            ch.proof = savedData[ch.id].proof || "";
                        }
                    });
                });
            }
        }

        function saveProgress() {
            const savedData = {};
            Object.keys(pucpData).forEach(tierKey => {
                pucpData[tierKey].challenges.forEach(ch => {
                    if (ch.status !== 'none') {
                        savedData[ch.id] = { status: ch.status, proof: ch.proof };
                    }
                });
            });
            localStorage.setItem('pucp_progress_v3', JSON.stringify(savedData));
        }

        function handleSearch() {
            searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
            renderTracker();
        }

        async function sendDiscordWebhook(tierObj, challenge, proofLink) {
            if (!DISCORD_WEBHOOK_URL) return;
            
            // Discord Webhook payload formatted with action links/notes since standard interactive buttons require a backend bot server.
            const payload = {
                content: `🔔 **PUCP Submission Pending Review!**\n> **Tier ${tierObj.tierNumber}:** ${tierObj.tierName}\n> **Level:** ${challenge.name} (${challenge.mode} - ID: ${challenge.levelId})\n> **Proof Link:** ${proofLink}\n\n*To approve/deny, use your local tracker review manager or reply accordingly.*`
            };

            try {
                await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (err) {
                console.error("Failed to send webhook to Discord:", err);
            }
        }

        function renderTracker() {
            const container = document.getElementById('tracker-container');
            container.innerHTML = '';

            let totalChallenges = 0;
            let totalCompleted = 0;

            const tierKeys = Object.keys(pucpData);
            if (tierKeys.length === 0) {
                container.innerHTML = `<div class="text-slate-400 text-center col-span-full">No challenges found.</div>`;
                return;
            }

            let visibleTiersCount = 0;

            tierKeys.forEach(tierKey => {
                const tierObj = pucpData[tierKey];
                const challenges = tierObj.challenges;
                if (challenges.length === 0) return;

                let tierCompleted = 0;
                let tierTotal = challenges.length;
                const colors = getExactTierColors(tierObj.tierNumber);

                const filteredChallenges = challenges.filter(ch => {
                    if (!searchQuery) return true;
                    const matchTier = tierKey.toLowerCase().includes(searchQuery) || String(tierObj.tierNumber).includes(searchQuery);
                    const matchName = ch.name.toLowerCase().includes(searchQuery);
                    const matchId = ch.levelId.toLowerCase().includes(searchQuery);
                    const matchMode = ch.mode.toLowerCase().includes(searchQuery);
                    return matchTier || matchName || matchId || matchMode;
                });

                if (searchQuery && filteredChallenges.length === 0 && !tierKey.toLowerCase().includes(searchQuery) && !String(tierObj.tierNumber).includes(searchQuery)) {
                    return;
                }

                visibleTiersCount++;

                let challengesHtml = (searchQuery && filteredChallenges.length === 0 ? challenges : filteredChallenges).map(ch => {
                    totalChallenges++;
                    
                    let statusIcon = '';
                    let isChecked = false;
                    let textStyle = '';
                    let statusBadge = '';

                    if (ch.status === 'approved') {
                        tierCompleted++;
                        totalCompleted++;
                        isChecked = true;
                        textStyle = 'line-through opacity-50';
                        statusBadge = `<span class="text-[10px] text-emerald-700 font-bold ml-2">[Approved]</span>`;
                    } else if (ch.status === 'pending') {
                        textStyle = 'italic font-medium';
                        statusBadge = `<span class="text-[10px] text-amber-700 font-bold ml-2">[Pending Review ❓]</span>`;
                    } else if (ch.status === 'rejected') {
                        statusBadge = `<span class="text-[10px] text-red-700 font-bold ml-2">[Rejected ❌]</span>`;
                    }

                    let proofLinkHtml = ch.proof ? `<a href="${ch.proof}" target="_blank" class="text-[10px] text-indigo-700 underline font-bold ml-2 hover:text-indigo-900">[View Proof]</a>` : '';

                    return `
                        <div class="flex items-center justify-between p-3 rounded-md transition border border-black/30" style="background-color: rgba(255, 255, 255, 0.35); color: #1e293b;">
                            <div>
                                <h3 class="font-bold text-sm ${textStyle}">${ch.name} ${statusBadge} ${proofLinkHtml}</h3>
                                <span class="text-[11px] opacity-75">${ch.mode} • ID: ${ch.levelId}</span>
                            </div>
                            <div class="flex items-center gap-2">
                                ${ch.status === 'pending' ? `
                                    <button onclick="adminAction('${tierKey.replace(/'/g, "\\'")}', '${ch.id}', 'approved')" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white px-2 py-1 rounded font-bold" title="Accept">✔</button>
                                    <button onclick="adminAction('${tierKey.replace(/'/g, "\\'")}', '${ch.id}', 'rejected')" class="text-xs bg-red-600 hover:bg-red-500 text-white px-2 py-1 rounded font-bold" title="Deny">✖</button>
                                ` : ''}
                                <input type="checkbox" id="${ch.id}" ${isChecked ? 'checked' : ''} ${ch.status === 'pending' ? 'disabled' : ''}
                                    onclick="event.preventDefault(); triggerCheckbox('${tierKey.replace(/'/g, "\\'")}', '${ch.id}')"
                                    class="w-5 h-5 accent-slate-900 rounded cursor-pointer ml-1">
                            </div>
                        </div>
                    `;
                }).join('');

                let tierPercentage = tierTotal > 0 ? Math.round((tierCompleted / tierTotal) * 100) : 0;

                let disclaimerHtml = '';
                if (tierObj.tierNumber === 21) {
                    disclaimerHtml = `<div class="text-[11px] font-semibold text-red-900 bg-red-500/20 px-2 py-1 rounded mb-3 border border-red-500/30">⚠️ From here on out you need video proof for submissions.</div>`;
                } else if (tierObj.tierNumber === 30) {
                    disclaimerHtml = `<div class="text-[11px] font-semibold text-red-900 bg-red-500/20 px-2 py-1 rounded mb-3 border border-red-500/30">⚠️ From here on out you need video proof & clicks.</div>`;
                }

                container.innerHTML += `
                    <section class="border border-black rounded-md p-5 flex flex-col justify-between shadow-xl" style="background-color: ${colors.card};">
                        <div>
                            <div class="rounded-md p-3.5 mb-4 flex justify-between items-start shadow-sm border border-black/40" style="background-color: ${colors.header}; color: ${colors.text};">
                                <div>
                                    <span class="text-[10px] font-black uppercase tracking-wider block opacity-90">Tier ${tierObj.tierNumber} • ${tierObj.requirement}</span>
                                    <h2 class="text-md font-black mt-0.5">${tierObj.tierName}</h2>
                                </div>
                                <span class="text-xs font-bold bg-black/10 px-2.5 py-1 rounded-md border border-black/20" style="color: ${colors.text};">${tierCompleted} / ${tierTotal}</span>
                            </div>
                            ${disclaimerHtml}
                            <div class="space-y-2">
                                ${challengesHtml}
                            </div>
                        </div>
                        <div class="mt-4 pt-3 border-t border-black/20 text-right">
                            <span class="text-xs font-bold text-slate-900">${tierPercentage}% Completed</span>
                        </div>
                    </section>
                `;
            });

            if (visibleTiersCount === 0) {
                container.innerHTML = `<div class="text-slate-400 text-center col-span-full py-12">No matching tiers or challenges found.</div>`;
            }

            let totalPercentage = totalChallenges > 0 ? Math.round((totalCompleted / totalChallenges) * 100) : 0;
            document.getElementById('total-progress-text').innerText = `${totalCompleted} / ${totalChallenges} (${totalPercentage}%)`;
        }

        window.triggerCheckbox = function(tierKey, chId) {
            const tierObj = pucpData[tierKey];
            if (!tierObj) return;
            const challenge = tierObj.challenges.find(ch => ch.id === chId);
            if (!challenge) return;

            if (challenge.status === 'approved' || challenge.status === 'rejected') {
                challenge.status = 'none';
                challenge.proof = "";
                saveProgress();
                renderTracker();
                return;
            }

            if (tierObj.tierNumber >= 21) {
                pendingTierKey = tierKey;
                pendingChId = chId;
                document.getElementById('proof-input').value = "";
                document.getElementById('proof-modal').style.display = 'flex';
            } else {
                challenge.status = 'approved';
                saveProgress();
                renderTracker();
            }
        }

        window.adminAction = function(tierKey, chId, action) {
            const tierObj = pucpData[tierKey];
            if (!tierObj) return;
            const challenge = tierObj.challenges.find(ch => ch.id === chId);
            if (!challenge) return;

            challenge.status = action; // 'approved' or 'rejected'
            saveProgress();
            renderTracker();
        }

        window.closeProofModal = function(confirmed) {
            const modal = document.getElementById('proof-modal');
            modal.style.display = 'none';

            if (confirmed && pendingTierKey && pendingChId) {
                const proofVal = document.getElementById('proof-input').value.trim();
                const tierObj = pucpData[pendingTierKey];
                if (tierObj) {
                    const challenge = tierObj.challenges.find(ch => ch.id === pendingChId);
                    if (challenge) {
                        challenge.status = 'pending'; // Sets checkmark to pending question mark state
                        challenge.proof = proofVal;
                        saveProgress();
                        renderTracker();
                        sendDiscordWebhook(tierObj, challenge, proofVal);
                    }
                }
            }
            pendingTierKey = null;
            pendingChId = null;
        }

        initTracker();
    </script>
</body>
</html>
