<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tier Colors (1-25)</title>
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background-color: #121212;
    color: #ffffff;
    padding: 2rem;
    margin: 0;
  }
  h1 {
    text-align: center;
    margin-bottom: 2rem;
  }
  .tier-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1rem;
    max-width: 1200px;
    margin: 0 auto;
  }
  .tier-card {
    padding: 1.25rem;
    border-radius: 12px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.2s ease;
  }
  .tier-card:hover {
    transform: translateY(-2px);
  }
  .tier-title {
    font-size: 1.1rem;
    font-weight: bold;
    margin-bottom: 0.5rem;
  }
  .tier-codes {
    font-size: 0.85rem;
    opacity: 0.9;
    font-family: monospace;
  }
</style>
</head>
<body>

<h1>Tiers 1 – 25</h1>
<div class="tier-grid" id="tierGrid"></div>

<script>
  const tiers = [
    { id: 1, dark: "#fd8989", light: "#ffb3b3" },
    { id: 2, dark: "#fbf09d", light: "#fff8c2" },
    { id: 3, dark: "#b1d3d4", light: "#d0f3f4" },
    { id: 4, dark: "#c17a7a", light: "#efa2a2" },
    { id: 5, dark: "#a37dd9", light: "#caa7fb" },
    { id: 6, dark: "#dbb7b7", light: "#efdbdb" },
    { id: 7, dark: "#f2b3c1", light: "#f2cad3" },
    { id: 8, dark: "#eccda9", light: "#f1dbc1" },
    { id: 9, dark: "#5d4cb0", light: "#897ad2" },
    { id: 10, dark: "#a8c6c8", light: "#c6e8ea" },
    { id: 11, dark: "#89b780", light: "#b4deab" },
    { id: 12, dark: "#6d8586", light: "#97b1b2" },
    { id: 13, dark: "#c3d19b", light: "#e8f4c8" },
    { id: 14, dark: "#74a89f", light: "#9bcfc6" },
    { id: 15, dark: "#9e4d40", light: "#c46f61" },
    { id: 16, dark: "#e3576f", light: "#ef7c90" },
    { id: 17, dark: "#caa567", light: "#e5c58f" },
    { id: 18, dark: "#ff76c6", light: "#ffa8db" },
    { id: 19, dark: "#4e5058", light: "#808495" },
    { id: 20, dark: "#3b6089", light: "#7194bb" },
    { id: 21, dark: "#a9c369", light: "#d1e996" },
    { id: 22, dark: "#9c4b69", light: "#cd7395" },
    { id: 23, dark: "#ff9df3", light: "#ffbdf7" },
    { id: 24, dark: "#8b5a70", light: "#c087a1" },
    { id: 25, dark: "#ff7564", light: "#ff9689" }
  ];

  // Helper function to calculate luminance and determine text color
  function getTextColor(hex) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    // Standard relative luminance formula
    const yiq = (r * 299 + g * 587 + b * 114) / 1000;
    return yiq >= 128 ? '#1a1a1a' : '#ffffff';
  }

  const grid = document.getElementById('tierGrid');

  tiers.forEach(tier => {
    const card = document.createElement('div');
    card.className = 'tier-card';
    card.style.background = `linear-gradient(135deg, ${tier.dark}, ${tier.light})`;
    card.style.color = getTextColor(tier.dark);

    card.innerHTML = `
      <div class="tier-title">Tier ${tier.id}</div>
      <div class="tier-codes">${tier.dark} / ${tier.light}</div>
    `;
    grid.appendChild(card);
  });
</script>

</body>
</html>
